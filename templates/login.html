<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>ISP NetMap Pro — Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#080c14;--surface:#0d1520;--surface2:#111d2e;--surface3:#162338;
  --border:#1e3050;--border2:#253d5e;
  --accent:#00c8ff;--accent2:#0080ff;--accent-glow:rgba(0,200,255,0.15);
  --green:#00e676;--red:#ff3d57;--orange:#ff9100;
  --text:#e8edf5;--text2:#7a9bbf;--text3:#4a6a8a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:'Manrope','Segoe UI',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:radial-gradient(ellipse at 20% 30%,rgba(0,128,255,.06) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 70%,rgba(0,200,255,.04) 0%,transparent 50%);
}
.login-card{
  background:var(--surface);border:1px solid var(--border2);border-radius:16px;
  padding:40px 36px;width:360px;max-width:95vw;
  box-shadow:0 32px 80px rgba(0,0,0,.5),0 0 0 1px rgba(0,200,255,.04);
  animation:fadeIn .3s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:28px}
.login-logo-text{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--accent)}
.login-logo-text span{color:var(--text)}
.login-subtitle{text-align:center;font-size:12px;color:var(--text3);margin-top:-20px;margin-bottom:28px;letter-spacing:.5px;text-transform:uppercase}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.form-input{
  width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;
  color:var(--text);font-family:inherit;font-size:14px;padding:10px 13px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.form-input::placeholder{color:var(--text3)}
.btn-login{
  width:100%;background:var(--accent2);color:#fff;border:none;border-radius:8px;
  padding:11px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;
  transition:all .15s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{background:var(--accent);color:var(--bg)}
.btn-login:disabled{opacity:.5;cursor:not-allowed}
.error-msg{
  background:rgba(255,61,87,.12);border:1px solid rgba(255,61,87,.4);border-radius:7px;
  padding:9px 12px;font-size:12px;color:var(--red);margin-top:14px;display:none;
  animation:fadeIn .2s ease;
}
.error-msg.show{display:block}
.login-footer{text-align:center;font-size:10px;color:var(--text3);margin-top:22px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lock-icon{font-size:32px;text-align:center;margin-bottom:6px}
</style>
</head>
<body>
<div class="login-card">
  <div class="lock-icon">🌐</div>
  <div class="login-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" stroke="#00c8ff" stroke-width="1.5"/><path d="M6 14 Q10 8 14 14 Q18 20 22 14" stroke="#00c8ff" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="6" cy="14" r="2" fill="#0080ff"/><circle cx="22" cy="14" r="2" fill="#00e676"/></svg>
    <div class="login-logo-text">ISP<span>NetMap</span>&nbsp;<span style="color:var(--text3);font-size:13px;font-weight:400">Pro</span></div>
  </div>
  <div class="login-subtitle">Acesso ao sistema</div>

  <div class="form-group">
    <label class="form-label">Usuário</label>
    <input class="form-input" id="inp-user" type="text" placeholder="seu.usuario" autocomplete="username" autofocus>
  </div>
  <div class="form-group">
    <label class="form-label">Senha</label>
    <input class="form-input" id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="btn-login" id="btn-login" onclick="doLogin()">
    <div class="spinner" id="spinner"></div>
    <span id="btn-text">Entrar</span>
  </button>

  <div class="error-msg" id="error-msg"></div>
  <div class="login-footer">ISP NetMap Pro · Acesso restrito</div>
</div>

<script>
document.getElementById('inp-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('inp-user').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('inp-pass').focus();
});

async function doLogin() {
  const user = document.getElementById('inp-user').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const btn = document.getElementById('btn-login');
  const err = document.getElementById('error-msg');
  const spinner = document.getElementById('spinner');
  const btnText = document.getElementById('btn-text');

  if (!user || !pass) {
    showError('Preencha usuário e senha.');
    return;
  }

  btn.disabled = true;
  spinner.style.display = 'block';
  btnText.textContent = 'Entrando...';
  err.classList.remove('show');

  try {
    let csrfToken = '';
    const metaTag = document.querySelector('meta[name="csrf-token"]');
    if(metaTag && metaTag.content) { csrfToken = metaTag.content; }
    if(!csrfToken) {
      try {
        const csrfRes = await fetch('/api/auth/csrf-token', {credentials:'same-origin'});
        const csrfData = await csrfRes.json();
        csrfToken = csrfData.csrf_token || '';
      } catch (_) {}
    }

    const headers = {'Content-Type':'application/json'};
    if (csrfToken) headers['X-CSRFToken'] = csrfToken;

    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers,
      body: JSON.stringify({username: user, password: pass}),
      credentials: 'same-origin',
    });
    const data = await res.json();
    if (res.ok && data.ok) {
      window.location.href = '/';
    } else {
      showError(data.error || 'Erro ao fazer login.');
    }
  } catch(e) {
    showError('Erro de conexão com o servidor.');
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.textContent = 'Entrar';
  }
}

function showError(msg) {
  const err = document.getElementById('error-msg');
  err.textContent = '⚠️ ' + msg;
  err.classList.add('show');
}
</script>
</body>
</html>
